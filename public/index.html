<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Gestão</title>
<meta name="theme-color" content="#090E1A">
<script src="js/theme-init.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B7CFA'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' text-anchor='middle' fill='%230B1220'%3EGP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">GP</span>
      <div class="brand-text">
        <strong>Painel de Gestão</strong>
        <span>operação &amp; serviços</span>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu">☰</button>
    </div>

    <nav class="nav" id="nav" aria-label="Módulos"></nav>

    <button class="reset-btn" id="resetData" hidden>↺ Restaurar dados de exemplo</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <span class="eyebrow" id="viewGroup">módulo</span>
        <h1 id="viewTitle">Carregando…</h1>
      </div>
      <div class="topbar-actions">
        <div class="topbar-clock">
          <span id="todayLabel"></span>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="tt-label" id="themeLabel">Tema escuro</span>
        </button>
        <div class="user-menu" id="userMenu" hidden>
          <button class="user-chip" id="userChip" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="user-avatar" id="userAvatar"></span>
            <span class="user-name" id="userName"></span>
          </button>
          <div class="user-pop" id="userPop" hidden>
            <div class="user-pop-head"><strong id="userPopName"></strong><span id="userPopEmail"></span></div>
            <button type="button" id="changePassword">Alterar senha</button>
            <button type="button" id="logoutBtn">Sair</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Novo registro</h3>
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
    </div>
    <form id="modalForm"></form>
  </div>
</div>

<div class="modal-backdrop confirm-backdrop" id="confirmBackdrop">
  <div class="modal modal-confirm" role="alertdialog" aria-modal="true" aria-describedby="confirmMsg">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="confirmCancel">Cancelar</button>
      <button type="button" class="btn btn-primary" id="confirmOk">Confirmar</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
